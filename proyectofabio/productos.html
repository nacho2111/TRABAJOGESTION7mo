<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi pagina</title>
    <link rel="stylesheet" href="est.css">
</head>

<body class="c">
    <h1><a href="index.html" class="camisuli">SISTEMA DE GESTION</a></h1>
    <h2>PRODUCTOS</h2>
    <div class="buscador">

        <input type="text" id="buscar-nombre" placeholder="buscar producto">
        <button id="btn-buscar">Buscar</button>
    </div>
    <div class="agregador">
        <input type="text" id="name" placeholder="nombre del producto" class="sera">
        <input type="text" id="price" placeholder="precio del producto" class="sera">
        <input type="text" id="id" placeholder="id del producto" class="sera">
        <input type="text" id="description" placeholder="descripcion del producto" class="sera">
        <button class="sera">agregar producto</button>
    </div>
    <div class="mostrador">
        <button class="sera">ver toda la lista de los productos</button>
    </div>

    <div class="eliminador">
        <button class="sera">eliminar producto</button>
    </div>

    <div class="modificador">
        <button class="sera">modificar producto</button>
    </div>

</body>


</html>
